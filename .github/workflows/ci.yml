name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: |
          node --check lib/client.js
          node --check lib/index.js
      - name: Smoke test
        run: node scripts/smoke.mjs
      - name: Zoom metrics test
        run: node scripts/zoom.test.mjs
